services:
  servidor:
    build:
      context: .
      dockerfile: Dockerfile_servidor
    container_name: servidor-gRPC
    ports:
      - 50051:50051

  cliente:
    build:
      context: .
      dockerfile: Dockerfile_cliente
    container_name: cliente-gRPC
    ports:
      - 8000:8000
    depends_on:
      - servidor
      