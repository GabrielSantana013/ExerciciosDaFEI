<!DOCTYPE html>
<html lang="pt">
<head>

<body>
    <div id = containerImagem>
    <img id = "imagem" src="usericon2.png">

    <h1>Cadastro</h1>
    
</body>
    <div id = "containerCadastro">
        <form action = "/cadastra" method="post">
            <label>Usuário:</label> <input type = "text" name = "user"><br>
            <label>Senha:</label>   <input type = "password" name = "password"><br>
            <input type = "submit" value = "cadastrar"><br>
        </form>
    </div>

    <h2>Exemplo de create: </h2>
<form action = "/cadastrar_usuario" method = "post">
    Nome: <input type="text" name="nome">
    Login: <input type="text" name="login">
    Senha: <input type="password" name="senha">
    <input type = "submit" value = "cadastrar"><br>
</form>
<h2>Exemplo de read: </h2>
<form action = "/logar_usuario" method = "post">
    Nome: <input type="text" name="nome">
    Login: <input type="text" name="login">
    Senha: <input type="password" name="senha">
    <input type="submit" value = "cadastrar"><br>
</form>

<h2>Exemplo de Update:</h2>
<form action = "/atualizarSenha" method = "post">
    Login:<input type = "text" name = "login">
    Senha atual:<input type ="password" name = "senhaAtual">
    Nova Senha:<input type="password" name="novaSenha">
    <input type="submit" value = "atualizar">
</form>

<h2>Exemplo de Delete: </h2>
<form action = "/removerUsuario" method="post">
    Login:<input type = "text" name = "login">
    Senha:<input type ="password" name = "senhaAtual">
    <input type="submit" value="deletar">
</form>
</html>
