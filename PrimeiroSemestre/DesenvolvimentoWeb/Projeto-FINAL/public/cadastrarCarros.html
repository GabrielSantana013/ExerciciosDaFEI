<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Carros</title>
    <link href="styleCadastrarCarros.css" rel="stylesheet">
</head>
<body>
    
    <div id="containerImagem">
        <img id = "imagem" src = imagens/fotoCarro.png>
    </div>

    <div id = containerCadastro>
        <form action="/cadastrar_carro" method="post">
            Marca:<input type="text" name="marca">
            Modelo:<input type="text" name="modelo">
            Ano:<input type="text" name="ano">
            Quantidade:<input type="number" name="qtde_disponivel">
            <input type="submit" value="Cadastrar Veículo">
        </form>
    </div>
    
</body>
</html>
